<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Borrowings</title>


</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            📚 Library
        </div>

        <nav>

            <a href="admin.dashboard.html">
                🏠 Dashboard
            </a>

            <a href="books.html">
                📚 Books
            </a>

            <a href="members.html">
                👥 Members
            </a>

            <a
                    href="borrowings.html"
                    class="active">

                🔄 Borrowings

            </a>

            <a href="#" onclick="logout()">
                🚪 Logout
            </a>

        </nav>

    </aside>

    <main class="main">

        <header class="topbar">

            <div>

                <h1>Borrowings</h1>

                <p>
                    Manage borrowed and returned books
                </p>

            </div>

            <button
                    class="btn primary"
                    onclick="openBorrowModal()">

                + Borrow Book

            </button>

        </header>

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Book</th>
                    <th>Member</th>
                    <th>Borrow Date</th>
                    <th>Due Date</th>
                    <th>Return Date</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

                </thead>

                <tbody id="borrowingsTable"></tbody>

            </table>

        </div>

    </main>

</div>

<div class="modal" id="borrowModal">

    <div class="modal-content">

        <span
                class="close"
                onclick="closeBorrowModal()">

            &times;

        </span>

        <h2>Borrow Book</h2>

        <form id="borrowForm">

            <div class="form-group">

                <label>Book</label>

                <select
                        id="borrowBook"
                        required>

                </select>

            </div>

            <div class="form-group">

                <label>Member</label>

                <select
                        id="borrowMember"
                        required>

                </select>

            </div>

            <div class="form-group">

                <label>Due Date</label>

                <input
                        type="date"
                        id="dueDate"
                        required>

            </div>

            <button class="btn primary full">
                Borrow Book
            </button>

        </form>

    </div>

</div>

<script src="js/borrowings.js"></script>

</body>
</html>
