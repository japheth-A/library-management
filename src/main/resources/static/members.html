<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Members</title>

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            📚 Library
        </div>

        <nav>

            <a href="admin.dashboard.html">
                🏠 Dashboard
            </a>

            <a href="books.html">
                📚 Books
            </a>

            <a
                    href="members.html"
                    class="active">

                👥 Members

            </a>

            <a href="borrowings.html">
                🔄 Borrowings
            </a>

            <a href="#" onclick="logout()">
                🚪 Logout
            </a>

        </nav>

    </aside>

    <main class="main">

        <header class="topbar">

            <div>

                <h1>Members</h1>

                <p>
                    Manage library members
                </p>

            </div>

            <button
                    class="btn primary"
                    onclick="openMemberModal()">

                + Add Member

            </button>

        </header>

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Registered</th>
                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="membersTable"></tbody>

            </table>

        </div>

    </main>

</div>

<div class="modal" id="memberModal">

    <div class="modal-content">

        <span
                class="close"
                onclick="closeMemberModal()">

            &times;

        </span>

        <h2 id="memberModalTitle">
            Add Member
        </h2>

        <form id="memberForm">

            <input
                    type="hidden"
                    id="memberId">

            <div class="form-group">

                <label>Name</label>

                <input
                        id="memberName"
                        required>

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                        type="email"
                        id="memberEmail"
                        required>

            </div>

            <div class="form-group">

                <label>Phone</label>

                <input id="memberPhone">

            </div>

            <div class="form-group">

                <label>Address</label>

                <input id="memberAddress">

            </div>

            <button class="btn primary full">
                Save Member
            </button>

        </form>

    </div>

</div>

<script src="js/members.js"></script>

</body>
</html>
