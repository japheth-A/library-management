<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login - LibraryMS</title>

    <link rel="stylesheet" href="css/user.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            📚
        </div>

        <h1>User Login</h1>

        <p class="auth-subtitle">
            Login to your library account
        </p>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
            >

            <label for="password">
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <div class="auth-link">
            Don't have an account?
            <a href="user-register.html">
                Create Account
            </a>
        </div>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

<script src="js/user-login.js"></script>

</body>

</html>
